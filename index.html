<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<title>Bajo Fácil en Eb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Figtree:wght@600;700;800&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: barra superior fija (título + herramientas) · partitura de tablatura que se desplaza · dock inferior fijo (nota actual + diapasón + play) */
:root{
  --bg:#f6f4ef; --paper:#fffdf9; --panel:#ffffff; --ink:#1b1916; --muted:#80776d; --line:#e2dbd0; --staff:#b9afa2;
  --accent:#d4572a; --accent-soft:#fbe4da; --onaccent:#fff; --loop:#2f7d7a; --loop-soft:rgba(47,125,122,.13);
  --wood:#5a3a25; --fret:#c9b48a; --string:#eadfc8; --inlay:#e9dfcb; --shadow:rgba(40,25,10,.12); --scrim:rgba(20,14,10,.55);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --paper:#1b1a17; --panel:#211f1c; --ink:#f1ebe3; --muted:#a39a90; --line:#35302a; --staff:#5b544c;
  --accent:#f0754a; --accent-soft:#3d2219; --onaccent:#1a0f0a; --loop:#4fb3ad; --loop-soft:rgba(79,179,173,.16);
  --wood:#3b2618; --fret:#a8946c; --string:#d9cdb5; --inlay:#6b5440; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --paper:#1b1a17; --panel:#211f1c; --ink:#f1ebe3; --muted:#a39a90; --line:#35302a; --staff:#5b544c;
  --accent:#f0754a; --accent-soft:#3d2219; --onaccent:#1a0f0a; --loop:#4fb3ad; --loop-soft:rgba(79,179,173,.16);
  --wood:#3b2618; --fret:#a8946c; --string:#d9cdb5; --inlay:#6b5440; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.7); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--panel)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px}
.title{display:flex;align-items:center;gap:10px}
.title h1{flex:1;margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(22px,5.4vw,30px);line-height:.95;min-width:0}
.title h1 small{display:block;font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:3px}
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tools::-webkit-scrollbar{display:none}
.seg{display:flex;flex:0 0 auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;min-height:34px;padding:0 10px;border-radius:7px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tbtn{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--loop);border-color:var(--loop);color:#fff}
.song{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:13px}
.song.ok{border-color:var(--loop);color:var(--loop)}
.hint{font-size:12px;font-weight:700;color:var(--loop);min-height:0}

/* Partitura */
.score-wrap{max-width:1180px;margin:0 auto;padding-block:10px calc(var(--dock-h,190px) + 20px)}
.score{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 0 10px;user-select:none;-webkit-user-select:none}
.row{display:block;cursor:pointer}
.row svg{display:block;overflow:visible}
.row text{font-family:var(--f-mono)}
.sl{fill:var(--staff)}
.bar{stroke:var(--staff)}
.mnum{fill:var(--muted);font-size:9px;font-weight:600}
.chd{fill:var(--ink);font-family:var(--f-body)!important;font-size:13px;font-weight:800}
.sec{fill:var(--accent);font-family:var(--f-body)!important;font-size:11px;font-weight:800;letter-spacing:.06em}
.nb{fill:var(--paper)}
.nt{fill:var(--ink);font-size:12px;font-weight:800}
.n.on .nb{fill:var(--accent)}
.n.on .nt{fill:var(--onaccent)}
.n.past .nt{fill:var(--muted)}
.lp{fill:var(--loop-soft)}
.cursor{position:absolute;width:3px;margin-left:-1px;border-radius:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 4px var(--accent-soft);transition:top .15s}
.cursor[hidden]{display:none}

/* Dock inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 28px var(--shadow);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ch now play" "fb fb fb";gap:6px 14px;align-items:center}
.ch{grid-area:ch;font-family:var(--f-display);font-weight:900;font-size:58px;line-height:.8;min-width:2.1ch}
.now{grid-area:now;min-width:0;display:flex;flex-direction:column;gap:2px}
.now b{font-size:clamp(17px,4.6vw,24px);font-weight:800;line-height:1.15}
.now span{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.ctrl{grid-area:play;display:flex;align-items:center;gap:8px}
.play{width:66px;height:66px;border-radius:50%;border:none;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;box-shadow:0 8px 20px var(--shadow)}
.play svg{width:28px;height:28px}
.re{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:19px}
.fb{grid-area:fb}
.fb svg{display:block;width:100%;height:auto;max-height:96px}
@media (max-width:480px){.ch{font-size:46px}.play{width:58px;height:58px}.re{width:40px;height:40px}.dock .in{gap:6px 10px}}
@media (min-width:900px){
  .dock .in{grid-template-columns:auto minmax(200px,280px) 1fr auto;grid-template-areas:"ch now fb play"}
  .fb svg{max-height:90px}
}
.count{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;pointer-events:none}
.count b{font-family:var(--f-display);font-weight:900;font-size:min(46vw,260px);color:#fff}
@media (prefers-reduced-motion:reduce){.cursor{transition:none}}
</style>
</head>

<header class="top gut">
  <div class="in">
    <div class="title">
      <h1>No te pido flores<small>Bajo 4 cuerdas · Eb · 106 BPM</small></h1>

    </div>
    <div class="fb" id="fb"></div>
  </div>
</footer>

      for(let m=r*mpr;m<Math.min(M,r*mpr+mpr);m++)if(m>=a&&m<=b){const x=LP+(m-r*mpr)*mw;g+='<rect class="lp" x="'+x+'" y="'+(SY-10)+'" width="'+mw+'" height="'+(3*SG+20)+'"/>'}}
    for(let s=0;s<4;s++)g+='<rect class="sl" x="'+LP+'" y="'+(yS(s)-.5)+'" width="'+(Math.min(mpr,M-r*mpr)*mw)+'" height="1"/><text x="6" y="'+(yS(s)+3.5)+'" text-anchor="middle" style="font-size:9px;font-weight:800" fill="var(--muted)">'+SNUM(s)+'</text>';
    for(let k=0;k<mpr;k++){const m=r*mpr+k;if(m>=M)break;const x=LP+k*mw;
      g+='<line class="bar" x1="'+x+'" x2="'+x+'" y1="'+yS(3)+'" y2="'+yS(0)+'"/>';
      if(k===mpr-1||m===M-1)g+='<line class="bar" x1="'+(x+mw)+'" x2="'+(x+mw)+'" y1="'+yS(3)+'" y2="'+yS(0)+'"/>';
      g+='<text class="mnum" x="'+(x+2)+'" y="'+(SY-6)+'">'+(m+1)+'</text>';
      if(secAt[m])g+='<text class="sec" x="'+(x+2)+'" y="12">'+secAt[m].toUpperCase()+'</text>';
      for(let bt=0;bt<4;bt++){const b=m*4+bt,c=chordAtBeat[b];if(c&&c!==chordAtBeat[b-1])g+='<text class="chd" x="'+(x+bt*4*sw+(bt?2:16))+'" y="28">'+c+'</text>'}
    }
    while(ni<notes.length&&Math.floor(notes[ni][0]/16)<r*mpr+mpr){const n=notes[ni],m=Math.floor(n[0]/16);
      if(m>=r*mpr){const x=LP+(m-r*mpr)*mw+(n[0]%16+.5)*sw,y=yS(n[3]),w=n[4]>9?16:10;
        g+='<g class="n" id="n'+ni+'"><rect class="nb" x="'+(x-w/2)+'" y="'+(y-7)+'" width="'+w+'" height="14" rx="3"/><text class="nt" x="'+x+'" y="'+(y+4.2)+'" text-anchor="middle">'+n[4]+'</text></g>'}
      ni++}
    html+='<div class="row" data-r="'+r+'">'+g+'</svg></div>';
  }
  $('rows').innerHTML=html;rowsEl=[...$('rows').children];noteEls=notes.map((_,i)=>document.getElementById('n'+i));
  lastNote=-2;lastRow=-1;draw(pos,true);
}
function xy(sl){const m=Math.max(0,Math.min(M-1,Math.floor(sl/16))),r=Math.floor(m/mpr),el=rowsEl[r];return {r,x:LP+(m-r*mpr)*mw+(sl-m*16)*sw,y:el?el.offsetTop:0}}

/* ====== Diapasón del dock ====== */
const FR=12,FW=430,FH=92,L0=26,L1=424,A0=70,A1=10;
const fAlong=f=>f===0?L0-10:L0+(L1-L0)*(f-.5)/FR,fLine=f=>L0+(L1-L0)*f/FR,fAcross=s=>A0+(A1-A0)*s/3;
(function(){let g='<svg viewBox="0 0 '+FW+' '+FH+'" role="img" aria-label="Diapasón"><rect x="'+L0+'" y="'+(A1-8)+'" width="'+(L1-L0)+'" height="'+(A0-A1+16)+'" rx="4" fill="var(--wood)"/>';
  [3,5,7,9].forEach(f=>g+='<circle cx="'+fAlong(f)+'" cy="'+(A0+A1)/2+'" r="4" fill="var(--inlay)"/>');[1,2].forEach(i=>g+='<circle cx="'+fAlong(12)+'" cy="'+(A1+(A0-A1)*i/3)+'" r="3.5" fill="var(--inlay)"/>');
  for(let f=0;f<=FR;f++)g+='<line x1="'+fLine(f)+'" x2="'+fLine(f)+'" y1="'+(A1-8)+'" y2="'+(A0+8)+'" stroke="'+(f?'var(--fret)':'var(--string)')+'" stroke-width="'+(f?2:5)+'"/>';
  for(let f=1;f<=FR;f++)g+='<text x="'+fAlong(f)+'" y="'+(FH-2)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="600" fill="var(--muted)">'+f+'</text>';
  for(let s=0;s<4;s++){const y=fAcross(s);g+='<line x1="'+L0+'" x2="'+L1+'" y1="'+y+'" y2="'+y+'" stroke="var(--string)" stroke-width="'+(4-s*.8)+'"/><text x="9" y="'+(y+4)+'" text-anchor="middle" font-family="Figtree,sans-serif" font-size="12" font-weight="800" fill="var(--muted)">'+SNUM(s)+'</text>'}
  $('fb').innerHTML=g+'<g id="fdots"></g></svg>'})();

/* ====== Estado visible ====== */
let pos=0,lastNote=-2,lastRow=-1,userScrollT=0;
function noteIdx(sl){let lo=0,hi=notes.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(notes[mid][0]<=sl){r=mid;lo=mid+1}else hi=mid-1}return r}
const where=n=>'Cuerda '+SNUM(n[3])+' · traste '+n[4];
function draw(sl,force){
  pos=sl;const c=xy(sl),cur=$('cursor');
  cur.style.left=c.x+'px';cur.style.top=(c.y+SY-12)+'px';cur.style.height=(3*SG+24)+'px';
  const b=Math.max(0,Math.floor(sl/4));$('ch').textContent=chordAtBeat[b]||'—';
  let i=noteIdx(sl);const n=notes[i],active=n&&sl<n[0]+Math.max(n[1],2);
  if(i!==lastNote||force){
    if(noteEls[lastNote])noteEls[lastNote].classList.remove('on');
    if(noteEls[i]&&active)noteEls[i].classList.add('on');
    lastNote=active?i:-2;
    const nx=notes[active?i+1:i+1],show=active?n:nx;
    $('nowTxt').textContent=show?where(show):'—';
    $('nextTxt').textContent=active?(nx?'luego '+SNUM(nx[3])+' · '+nx[4]:''):(show?'prepárate':'');
    let g='';
    if(nx&&active)g+='<circle cx="'+fAlong(nx[4])+'" cy="'+fAcross(nx[3])+'" r="10" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
    if(show)g+='<g opacity="'+(active?1:.5)+'"><circle cx="'+fAlong(show[4])+'" cy="'+fAcross(show[3])+'" r="12" fill="var(--accent)"/><text x="'+fAlong(show[4])+'" y="'+(fAcross(show[3])+4.5)+'" text-anchor="middle" font-family="Figtree,sans-serif" font-size="12" font-weight="800" fill="#fff">'+show[4]+'</text></g>';
    $('fdots').innerHTML=g;
  }
  if(c.r!==lastRow){lastRow=c.r;
    if(playing&&Date.now()-userScrollT>2500){const top=$('score').offsetTop+c.y-document.querySelector('.top').offsetHeight-16;window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}}
}
['wheel','touchmove'].forEach(e=>addEventListener(e,()=>userScrollT=Date.now(),{passive:true}));

/* ====== Toques en la partitura: saltar o elegir bucle ====== */
$('rows').addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;const r=+row.dataset.r,x=e.clientX-row.getBoundingClientRect().left;
  const m=Math.max(0,Math.min(M-1,r*mpr+Math.floor((x-LP)/mw)));
  if(picking===1){loopA=m;loopB=null;picking=2;hint('Ahora toca el compás final');layout();return}
  if(picking===2){loopB=m;picking=0;loopOn=true;hint('Bucle: compases '+(Math.min(loopA,loopB)+1)+'–'+(Math.max(loopA,loopB)+1));layout();seek(Math.min(loopA,loopB)*16);return}
  seek(m*16);
});
function hint(t){const h=$('hint');h.textContent=t||'';h.hidden=!t}
$('loopBtn').addEventListener('click',()=>{
  if(loopOn||picking){loopOn=false;picking=0;loopA=loopB=null;$('loopBtn').setAttribute('aria-pressed','false');hint('');layout();return}
  picking=1;$('loopBtn').setAttribute('aria-pressed','true');hint('Toca el compás donde empieza el bucle');
});
const loopRange=()=>loopOn&&loopA!=null&&loopB!=null?[Math.min(loopA,loopB)*16,(Math.max(loopA,loopB)+1)*16]:null;

/* ====== Controles ====== */
function setMode(m){mode=m;store.set('nt-mode',m);notes=m==='easy'?EASY:D.notes;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));if(playing&&!au){stop();play()}layout()}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function setSpeed(s){speed=s;store.set('nt-speed',s);document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===s)));if(au)au.playbackRate=s;if(playing&&!au){const p=pos;stop();play(p)}}
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.s)));
function ui(on){$('icoPlay').toggleAttribute('hidden',on);$('icoStop').toggleAttribute('hidden',!on);$('play').setAttribute('aria-label',on?'Pausa':'Tocar')}
$('play').addEventListener('click',()=>playing?stop():play());
$('re').addEventListener('click',()=>{const lr=loopRange();seek(lr?lr[0]:firstSlot())});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();playing?stop():play()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
const firstSlot=()=>Math.max(0,(notes[0]?notes[0][0]:0)-16-(notes[0]?notes[0][0]%16:0));

/* ====== Reproducción ====== */
let playing=false,raf=0,ctx=null,timer=null,wake=null,au=null,auMix=null,auBass=null,src=store.get('nt-src','mix');
let sStart=0,cStart=0,countUntil=-1;
function clock(){ // posición en semicorcheas
  if(au)return (au.currentTime-D.t0)/DT;
  return sStart+(ctx.currentTime-cStart)*speed/DT;
}
function frame(){
  if(!playing)return;let sl=clock();const lr=loopRange();
  if(lr&&sl>=lr[1]){if(au){au.currentTime=tAt(lr[0])}else{stop();play(lr[0],true);return}sl=lr[0]}
  if(sl<countUntil){$('count').hidden=false;$('countN').textContent=Math.max(1,Math.min(4,4-Math.floor((countUntil-sl)/4)))}else $('count').hidden=true;
  if(sl>=M*16||(au&&au.ended)){stop();seek(firstSlot());return}
  draw(Math.max(sl,0));raf=requestAnimationFrame(frame);
}
function play(from,noCount){
  from=from??pos;const lr=loopRange();if(lr&&(from<lr[0]||from>=lr[1]))from=lr[0];
  countUntil=noCount?-1:from;
  if(au){
    au.playbackRate=speed;try{au.preservesPitch=true;au.webkitPreservesPitch=true}catch(e){}
    au.currentTime=Math.max(0,tAt(from-(noCount?0:16)));
    Promise.resolve(au.play()).then(begin).catch(()=>{});return;
  }
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!ctx)ctx=new AC();ctx.resume();
  const lead=noCount?0.08:0.12+4*D.a/speed;
  if(!noCount)for(let k=0;k<4;k++)tick(ctx.currentTime+0.12+k*D.a/speed,k===0);
    let j=Math.max(0,noteIdx(from-0.01)+1);
  const sched=()=>{while(j<notes.length){const n=notes[j],t=cStart+(n[0]-sStart)*DT/speed;if(t>ctx.currentTime+0.35)break;if(t>=ctx.currentTime-0.02)pluck(t,n[2],Math.max(n[1],1)*DT/speed);j++}};
  sStart=from-lead*speed/DT;cStart=ctx.currentTime;   // el reloj incluye la cuenta
  sched();timer=setInterval(sched,60);begin();
}
function begin(){playing=true;ui(true);lastNote=-2;raf=requestAnimationFrame(frame);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function stop(){playing=false;ui(false);cancelAnimationFrame(raf);clearInterval(timer);$('count').hidden=true;if(au)au.pause();if(ctx&&!(au instanceof BufPlayer))ctx.suspend();try{wake&&wake.release()}catch(e){}}
function seek(sl){const was=playing;if(was)stop();draw(sl,true);lastRow=-1;const c=xy(sl);if(!was){const top=$('score').offsetTop+c.y-document.querySelector('.top').offsetHeight-16;if(Math.abs(scrollY-top)>innerHeight*0.6)window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}if(was)play(sl)}
function pluck(t,midi,dur){const f=440*Math.pow(2,(midi-69)/12),o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f*2;o2.type='sine';o2.frequency.value=f;lp.type='lowpass';lp.frequency.setValueAtTime(1600,t);lp.frequency.exponentialRampToValueAtTime(400,t+0.3);
  const end=t+Math.max(0.12,dur*0.95);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45,t+0.006);g.gain.exponentialRampToValueAtTime(0.18,t+0.25);g.gain.setValueAtTime(0.18,Math.max(t+0.25,end-0.04));g.gain.exponentialRampToValueAtTime(0.0001,end);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(ctx.destination);[o,o2].forEach(x=>{x.start(t);x.stop(end+0.03)})}
function tick(t,strong){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=strong?1600:1100;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.08)}

/* ====== Audio: canción y bajo solo ====== */
class BufPlayer{constructor(blob){this.blob=blob;this.buf=null;this.off=0;this.src=null;this.t0=0;this.playbackRate=1;this.ended=false}
  get currentTime(){return this.src?this.off+(ctx.currentTime-this.t0)*this.playbackRate:this.off}
  set currentTime(v){const p=!!this.src;if(p)this._stop();this.off=Math.max(0,v);if(p)this._start()}
  async _load(){if(!this.buf){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();this.buf=await ctx.decodeAudioData(await this.blob.arrayBuffer())}}
  _start(){const s=ctx.createBufferSource();s.buffer=this.buf;s.playbackRate.value=this.playbackRate;s.connect(ctx.destination);s.start(0,this.off);this.src=s;this.t0=ctx.currentTime;this.ended=false;s.onended=()=>{if(this.src===s)this.ended=true}}
  _stop(){if(this.src){this.off=this.currentTime;const s=this.src;this.src=null;try{s.stop()}catch(e){}}}
  async play(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();await this._load();this._start()}
  pause(){this._stop()}}
function mkAudio(blob){const a=new Audio(URL.createObjectURL(blob));a.preload='auto';a.setAttribute('playsinline','');try{a.preservesPitch=true;a.webkitPreservesPitch=true}catch(e){}
  a.addEventListener('error',()=>{const b=new BufPlayer(blob);if(auMix===a)auMix=b;if(auBass===a)auBass=b;if(au===a)au=b},{once:true});return a}
function pickSrc(s){src=s;store.set('nt-src',s);const was=playing,p=pos;if(was)stop();au=(s==='bass'&&auBass)?auBass:(auMix||auBass);
  document.querySelectorAll('[data-src]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.src===(au===auBass?'bass':'mix'))));if(was)play(p,true)}
document.querySelectorAll('[data-src]').forEach(b=>b.addEventListener('click',()=>pickSrc(b.dataset.src)));
function songUI(){$('load').textContent=au?'🎵 Cambiar':'🎵 Cargar canción';$('load').classList.toggle('ok',!!au);$('src').hidden=!(auMix&&auBass)}
function db(){return new Promise((r,j)=>{try{const q=indexedDB.open('ntpf',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j}catch(e){j(e)}})}
$('load').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;stop();auMix=mkAudio(f);pickSrc('mix');songUI();try{(await db()).transaction('f','readwrite').objectStore('f').put({blob:f,name:f.name},'song')}catch(x){}});
(async()=>{
  try{const d=await db();const v=await new Promise(r=>{const q=d.transaction('f').objectStore('f').get('song');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v&&v.blob)auMix=mkAudio(v.blob)}catch(e){}
  for(const [name,set] of [['cancion.mp3',a=>{if(!auMix)auMix=a}],['bajo.mp3',a=>auBass=a]]){try{const r=await fetch(name);if(r.ok){const b=await r.blob();if(b.size>100000)set(mkAudio(b))}}catch(e){}}
  if(auMix||auBass)pickSrc(src);songUI();
})();

/* ====== Inicio ====== */
setSpeed(speed);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
const ro=new ResizeObserver(()=>{if(Math.abs($('score').clientWidth-W)>2)layout()});ro.observe($('score'));
new ResizeObserver(()=>document.documentElement.style.setProperty('--dock-h',$('dock').offsetHeight+'px')).observe($('dock'));
pos=firstSlot();layout();
window.__tab={get playing(){return playing},get pos(){return pos},get audio(){return !!au},notes:()=>notes.length};
})();
</script>
</body>
</html>
