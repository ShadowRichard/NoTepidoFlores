<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
<title>Bajo Fácil en Eb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Figtree:wght@700;800&display=swap">
<style>
/* Layout: una columna centrada. Acorde gigante → cuerda y traste → diapasón → botón */
:root{
  --bg:#f3f1ec; --panel:#fff; --ink:#1d1a17; --muted:#857c73; --line:#ddd5ca;
  --wood:#5a3a25; --fret:#c9b48a; --string:#eadfc8; --inlay:#e9dfcb; --accent:#d4572a; --onaccent:#fff; --scrim:rgba(20,14,10,.55);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151311; --panel:#1f1c19; --ink:#f1ebe3; --muted:#a59c92; --line:#36302a;
  --wood:#3b2618; --fret:#a8946c; --string:#d9cdb5; --inlay:#6b5440; --accent:#f0754a; --onaccent:#1a0f0a; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151311; --panel:#1f1c19; --ink:#f1ebe3; --muted:#a59c92; --line:#36302a;
  --wood:#3b2618; --fret:#a8946c; --string:#d9cdb5; --inlay:#6b5440; --accent:#f0754a; --onaccent:#1a0f0a; --scrim:rgba(0,0,0,.7); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chord{font-family:var(--f-display);font-weight:900;font-size:clamp(120px,40vw,220px);line-height:.8;text-align:center}
.next{font-weight:800;font-size:18px;color:var(--muted);text-align:center;min-height:1.3em}
.where{font-weight:800;font-size:clamp(26px,8vw,40px);text-align:center}
.board{width:100%;max-width:560px}
.board svg{display:block;width:100%;height:auto}
.play{width:110px;height:110px;border-radius:50%;border:none;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.play svg{width:44px;height:44px}
.play:active{transform:scale(.97)}
.load{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px}
.count{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;pointer-events:none}
.count b{font-family:var(--f-display);font-weight:900;font-size:min(55vw,300px);color:#fff}
</style>
</head>
<body>
<div class="chord" id="chord">Ab</div>
<div class="next" id="next"></div>
<div class="where" id="where">E · 4</div>
<div class="board" id="board"></div>
<button class="play" id="play" type="button" aria-label="Tocar"><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><svg id="icoStop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
<button class="load" id="load" type="button" aria-label="Cargar canción" title="Cargar canción">🎵</button>
<input type="file" id="file" accept="audio/*,.mp3,.m4a" hidden>
<div class="count" id="count" hidden><b id="countN">1</b></div>

<script>
(()=>{
'use strict';
// Acordes: PDF de Moises.ai (cover de Miguel Torres) alineados con la grabación · Eb · 106 BPM · A440
const OPEN=[28,33,38,43],SN=['E','A','D','G'];
const ROOT={Eb:[1,6],Bb:[0,6],Cm:[1,3],Ab:[0,4],Fm:[0,1]};
const REC={"a":0.56176,"t0":0.0268,"segs":[["Ab","Intro",12,2],["Eb","Intro",14,16],["Ab","Intro",30,4],["Eb","Intro",34,4],["Bb","Intro",38,4],["Fm","Intro",42,4],["Ab","Intro",46,2],["Bb","Intro",48,2],["Eb","Intro",50,4],["Bb","Intro",54,4],["Fm","Intro",58,4],["Ab","Intro",62,4],["Eb","Intro",66,6],["Bb","Estrofa",72,2],["Cm","Estrofa",74,4],["Ab","Estrofa",78,4],["Eb","Estrofa",82,8],["Bb","Estrofa",90,2],["Cm","Estrofa",92,2],["Ab","Estrofa",94,6],["Fm","Estrofa",100,2],["Bb","Pre-coro",102,2],["Eb","Pre-coro",104,6],["Cm","Pre-coro",110,4],["Bb","Pre-coro",114,2],["Ab","Pre-coro",116,2],["Bb","Pre-coro",118,6],["Eb","Pre-coro",124,2],["Bb","Coro",126,4],["Fm","Coro",130,4],["Ab","Coro",134,4],["Eb","Coro",138,6],["Bb","Coro",144,2],["Fm","Coro",146,4],["Ab","Coro",150,2],["Eb","Coro",152,16],["Bb","Coro",168,4],["Eb","Interludio",172,2],["Bb","Interludio",174,6],["Fm","Interludio",180,4],["Ab","Interludio",184,2],["Eb","Interludio",186,8],["Bb","Estrofa 2",194,2],["Cm","Estrofa 2",196,4],["Ab","Estrofa 2",200,4],["Eb","Estrofa 2",204,6],["Bb","Estrofa 2",210,2],["Cm","Estrofa 2",212,4],["Ab","Estrofa 2",216,6],["Bb","Pre-coro 2",222,2],["Eb","Pre-coro 2",224,8],["Cm","Pre-coro 2",232,4],["Ab","Pre-coro 2",236,4],["Bb","Pre-coro 2",240,4],["Eb","Pre-coro 2",244,2],["Bb","Coro 2",246,6],["Fm","Coro 2",252,4],["Ab","Coro 2",256,4],["Eb","Coro 2",260,4],["Bb","Coro 2",264,4],["Fm","Coro 2",268,4],["Ab","Coro 2",272,4],["Eb","Coro 2",276,2],["Bb","Coro 2",278,10],["Ab","Interludio 2",288,4],["Eb","Interludio 2",292,4],["Bb","Interludio 2",296,4],["Fm","Interludio 2",300,4],["Ab","Interludio 2",304,12],["Eb","Puente",316,16],["Fm","Puente",332,4],["Bb","Puente",336,2],["Ab","Puente",338,6],["Fm","Puente",344,2],["Eb","Puente",346,4],["Bb","Puente",350,4],["Fm","Puente",354,2],["Ab","Puente",356,6],["Eb","Puente",362,4],["Bb","Puente",366,4],["Fm","Puente",370,2],["Ab","Puente",372,4],["Eb","Puente",376,4],["Bb","Puente",380,6],["Fm","Puente",386,2],["Ab","Puente",388,2],["Eb","Puente",390,6],["Bb","Puente 2",396,6],["Fm","Puente 2",402,4],["Ab","Puente 2",406,2],["Eb","Puente 2",408,6],["Bb","Puente 2",414,2],["Fm","Puente 2",416,6],["Ab","Puente 2",422,2],["Eb","Puente 2",424,6],["Bb","Coro 3",430,4],["Fm","Coro 3",434,2],["Ab","Coro 3",436,4],["Eb","Coro 3",440,4],["Bb","Coro 3",444,2],["Fm","Coro 3",446,6],["Ab","Coro 3",452,2],["Eb","Final",454,6],["Bb","Final",460,2],["Fm","Final",462,8],["Ab","Final",470,2],["Eb","Final",472,4],["Bb","Final",476,4],["Fm","Final",480,6],["Ab","Final",486,2],["Eb","Final",488,8]]};
const CH=REC.segs.map(x=>({c:x[0],start:x[2],len:x[3]}));
const $=id=>document.getElementById(id);
let audio=null,playing=false,cur=-1,raf=0,ctx=null,timer=null,wake=null;

/* Diapasón */
const FR=9,W=430,H=150,L0=46,L1=422,A0=118,A1=22;
const along=f=>L0+(L1-L0)*(f-0.5)/FR,lineAt=f=>L0+(L1-L0)*f/FR,across=s=>A0+(A1-A0)*s/3;
(function(){let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Diapasón de bajo"><rect x="'+L0+'" y="'+(A1-14)+'" width="'+(L1-L0)+'" height="'+(A0-A1+28)+'" rx="6" fill="var(--wood)"/>';
  [3,5,7,9].forEach(f=>g+='<circle cx="'+along(f)+'" cy="'+(A0+A1)/2+'" r="5" fill="var(--inlay)"/>');
  for(let f=0;f<=FR;f++)g+='<line x1="'+lineAt(f)+'" x2="'+lineAt(f)+'" y1="'+(A1-14)+'" y2="'+(A0+14)+'" stroke="'+(f?'var(--fret)':'var(--string)')+'" stroke-width="'+(f?2.5:6)+'"/>';
  for(let s=0;s<4;s++){const y=across(s);g+='<line x1="'+L0+'" x2="'+L1+'" y1="'+y+'" y2="'+y+'" stroke="var(--string)" stroke-width="'+(5-s*1.1)+'"/><text x="20" y="'+(y+5)+'" text-anchor="middle" font-family="Figtree,sans-serif" font-size="15" font-weight="800" fill="var(--muted)">'+SN[s]+'</text>'}
  $('board').innerHTML=g+'<g id="dot"></g></svg>'})();

function show(i){
  if(i===cur)return;cur=i;const c=CH[i].c,[s,f]=ROOT[c];
  $('chord').textContent=c;$('where').textContent=SN[s]+' · '+f;
  $('next').textContent=CH[i+1]?'luego '+CH[i+1].c:'';
  $('dot').innerHTML='<circle cx="'+along(f)+'" cy="'+across(s)+'" r="17" fill="var(--accent)"/><text x="'+along(f)+'" y="'+(across(s)+5)+'" text-anchor="middle" font-family="Figtree,sans-serif" font-size="15" font-weight="800" fill="#fff">'+f+'</text>';
}
const idxAt=b=>{let i=0;while(i+1<CH.length&&CH[i+1].start<=b)i++;return i};

/* Reproducción */
function ui(on){$('icoPlay').toggleAttribute('hidden',on);$('icoStop').toggleAttribute('hidden',!on);$('play').setAttribute('aria-label',on?'Parar':'Tocar')}
function loop(){
  if(!playing)return;
  const b=(clock()-REC.t0)/REC.a-CH[0].start;
  if(b<0){$('count').hidden=false;$('countN').textContent=Math.max(1,Math.min(4,Math.floor(b+4)+1))}
  else{$('count').hidden=true;show(idxAt(b+CH[0].start))}
  if(ended()){stop();cur=-1;show(0);return}
  raf=requestAnimationFrame(loop);
}
let clock=()=>0,ended=()=>false;
function play(){
  if(audio){
    audio.currentTime=Math.max(0,REC.t0+(CH[0].start-4)*REC.a);
    Promise.resolve(audio.play()).then(()=>{clock=()=>audio.currentTime;ended=()=>audio.ended;start()}).catch(()=>{});
  }else{ // sin canción: suena la nota con un bajo sencillo
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!ctx)ctx=new AC();ctx.resume();
    const t0=ctx.currentTime+0.1,base=REC.t0+(CH[0].start-4)*REC.a;
    clock=()=>base+(ctx.currentTime-t0);ended=()=>cur===CH.length-1&&clock()>REC.t0+(CH.at(-1).start+CH.at(-1).len)*REC.a;
    let k=0;timer=setInterval(()=>{while(k<CH.length&&REC.t0+CH[k].start*REC.a-base+t0<ctx.currentTime+0.2){
      const x=CH[k],[s,f]=ROOT[x.c],t=t0+(REC.t0+x.start*REC.a-base);
      for(let j=0;j<x.len;j+=2)note(t+j*REC.a,OPEN[s]+f,REC.a*1.8);k++}},50);
    start();
  }
}
function note(t,midi,dur){const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(midi-69)/12)*2;lp.type='lowpass';lp.frequency.value=900;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05)}
function start(){playing=true;ui(true);cur=-1;raf=requestAnimationFrame(loop);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function stop(){playing=false;ui(false);cancelAnimationFrame(raf);clearInterval(timer);$('count').hidden=true;if(audio)audio.pause();if(ctx)ctx.suspend();try{wake&&wake.release()}catch(e){}}
$('play').addEventListener('click',()=>playing?stop():play());
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});

/* Canción: incluida (cancion.mp3), guardada en este navegador o cargada con 🎵 */
function setSong(blob){if(audio)audio.pause();audio=new Audio(URL.createObjectURL(blob));audio.preload='auto';audio.setAttribute('playsinline','');$('load').style.opacity='.45'}
function db(){return new Promise((r,j)=>{try{const q=indexedDB.open('ntpf',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j}catch(e){j(e)}})}
$('load').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;stop();setSong(f);try{(await db()).transaction('f','readwrite').objectStore('f').put({blob:f,name:f.name},'song')}catch(x){}});
(async()=>{
  try{const d=await db();const v=await new Promise(r=>{const q=d.transaction('f').objectStore('f').get('song');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v&&v.blob){setSong(v.blob);return}}catch(e){}
  try{const r=await fetch('cancion.mp3');if(r.ok){const b=await r.blob();if(b.size>100000)setSong(b)}}catch(e){}
})();
show(0);
})();
</script>
</body>
</html>
